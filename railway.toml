# Railway deployment config. https://docs.railway.com/reference/config-as-code
# Railpack detects Bun from bun.lock and installs deps automatically.
#
# One-time dashboard setup (cannot be expressed here):
#   1. Attach a Volume to this service, mount path "/data".
#   2. Set the environment variables listed under "Variables" below.
#   3. After the first deploy, copy the public domain into BASE_URL and add
#      "<BASE_URL>/auth/callback" as an authorized redirect URI in the Google
#      OAuth client, then redeploy.

[deploy]
startCommand = "bun run start"
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 1

# ---- Variables to set in the Railway dashboard (not read from this file) ----
# Required:
#   API_TOKEN         a long random string (agents send it as the bearer token)
#   SESSION_SECRET    openssl rand -hex 32
#   GOOGLE_CLIENT_ID
#   GOOGLE_CLIENT_SECRET
#   ALLOWED_EMAILS    comma-separated allowlist, e.g. you@example.com
#   BASE_URL          the service's public https URL (set after first deploy)
#   DATA_DIR          /data   (must match the mounted volume path)
# The GitHub App. All six required; the server refuses to boot without them.
# GITHUB_APP_PRIVATE_KEY is the PEM base64-encoded, because a Railway variable
# does not survive its newlines: base64 -w0 < app.private-key.pem
#   GITHUB_APP_ID
#   GITHUB_APP_SLUG
#   GITHUB_APP_PRIVATE_KEY
#   GITHUB_APP_CLIENT_ID
#   GITHUB_APP_CLIENT_SECRET
#   GITHUB_WEBHOOK_SECRET
# Envelope encryption, for the credentials Seer stores and reads back — a user's
# fine-grained GitHub token is the first. Read lazily, so an instance without it
# boots and passes its healthcheck and then fails at the first token pasted.
# Set it BEFORE anyone connects a credential, and never lose it afterwards: it is
# the only thing that can open what was sealed under it.
#   SEER_ENCRYPTION_KEYS  v1:$(openssl rand -base64 32)
#   SEER_ENCRYPTION_ACTIVE_KEY  v1
# Blob store (bundle zips + images) in S3 — set all of these together. On the
# first boot with S3_BUCKET set, the app copies every existing blob from the
# volume into the bucket (idempotent; local files are left in place). SQLite
# stays on the volume; everything else lives in S3.
#   S3_BUCKET             the bucket name
#   S3_REGION             e.g. eu-north-1 (or S3_ENDPOINT for non-AWS stores)
#   S3_ACCESS_KEY_ID      IAM user scoped to that bucket
#   S3_SECRET_ACCESS_KEY
# Railway injects PORT automatically; the app reads it.
